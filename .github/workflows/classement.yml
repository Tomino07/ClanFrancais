name: Mise à jour du classement
on:
  schedule:
    - cron: "7,37 * * * *"   # toutes les 30 min (à :07 et :37, heures moins chargées chez GitHub)
  workflow_dispatch:          # bouton pour lancer à la main
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Récupérer les données
        env:
          CR_TOKEN: ${{ secrets.CR_TOKEN }}
        run: |
          API="https://proxy.royaleapi.dev/v1"
          AUTH="Authorization: Bearer $CR_TOKEN"
          mkdir -p data/joueurs data/progression
          curl -sf -H "$AUTH" "$API/clans/%23LJ8GVLQC" > clan.json
          curl -sf -H "$AUTH" "$API/locations/57000087/rankings/clans?limit=1000" > rank.json
          curl -sf -H "$AUTH" "$API/clans/%23LJ8GVLQC/riverracelog?limit=10" > log.json || echo '{"items":[]}' > log.json
          jq -n --slurpfile c clan.json --slurpfile r rank.json '
            ($r[0].items | map(select(.tag == "#LJ8GVLQC")) | first) as $me |
            {
              majAt: (now | todate),
              rang: ($me.rank // null),
              rangPrecedent: ($me.previousRank // null),
              score: $c[0].clanScore,
              tropheesGuerre: $c[0].clanWarTrophies,
              membres: $c[0].members,
              joueurs: [$c[0].memberList[] | {tag: (.tag | ltrimstr("#")), nom: .name, role, trophees: .trophies, dons: .donations, vu: .lastSeen}]
            }' > data/clan.json

          # Historique du rang (30 derniers jours, un point toutes les 30 min)
          [ -f data/historique.json ] || echo '[]' > data/historique.json
          jq --slurpfile c data/clan.json '. + [{date: $c[0].majAt, rang: $c[0].rang, score: $c[0].score, guerre: $c[0].tropheesGuerre, membres: $c[0].membres}] | .[-1440:]' data/historique.json > h.json
          mv h.json data/historique.json

          # MVP de la semaine : podium de la dernière guerre terminée
          jq -n --slurpfile log log.json --slurpfile c clan.json '
            try (
              $log[0].items[0] as $w
              | ($w.standings[] | select(.clan.tag == "#LJ8GVLQC") | .clan.participants) as $p
              | {
                  semaine: "Saison \($w.seasonId) – semaine \($w.sectionIndex + 1)",
                  podium: ($p | map(select(.fame > 0)) | sort_by(-.fame, -.decksUsed) | .[0:3] | map(
                    . as $j | {
                      tag: (.tag | ltrimstr("#")),
                      nom: .name,
                      points: .fame,
                      combats: .decksUsed,
                      membre: any($c[0].memberList[]; .tag == $j.tag)
                    }))
                }
            ) catch {podium: []}' > data/mvp.json

          # Arrivées et départs : on compare la liste des membres avec celle du passage précédent
          [ -f data/membres-precedents.json ] || jq '[.memberList[] | {tag, nom: .name}]' clan.json > data/membres-precedents.json
          [ -f data/mouvements.json ] || echo '[]' > data/mouvements.json
          jq --slurpfile c clan.json --slurpfile prev data/membres-precedents.json --arg now "$(date -u +%FT%TZ)" '
            ([$c[0].memberList[] | {tag, nom: .name}]) as $act
            | ($act | map(.tag)) as $tA
            | ($prev[0] | map(.tag)) as $tP
            | . + [$act[] | select(.tag as $t | $tP | index($t) | not) | {date: $now, type: "arrivee", nom, tag: (.tag | ltrimstr("#"))}]
                + [$prev[0][] | select(.tag as $t | $tA | index($t) | not) | {date: $now, type: "depart", nom, tag: (.tag | ltrimstr("#"))}]
            | .[-50:]' data/mouvements.json > m.json && mv m.json data/mouvements.json || true
          jq '[.memberList[] | {tag, nom: .name}]' clan.json > data/membres-precedents.json

          # Date d arrivee de chaque membre (data/arrivees.json, jamais raccourci).
          # Au tout premier passage, les membres deja presents sont notes "avant" (date inconnue).
          if [ -f data/arrivees.json ]; then
            jq --slurpfile c data/clan.json --arg now "$(date -u +%FT%TZ)" '
              . as $a | reduce $c[0].joueurs[] as $j ({}; .[$j.tag] = ($a[$j.tag] // $now))' data/arrivees.json > a.json && mv a.json data/arrivees.json || true
          else
            jq '[.joueurs[] | {key: .tag, value: "avant"}] | from_entries' data/clan.json > data/arrivees.json || true
          fi

          # Guerre en direct : les 5 clans de la course en cours
          if curl -sf -H "$AUTH" "$API/clans/%23LJ8GVLQC/currentriverrace" > cur.json; then
            jq '{
              type: .periodType,
              jour: ((.periodIndex // -1) % 7),   # 0-2 entraînement, 3-6 jours de guerre
              majAt: (now | todate),
              objectif: (if .periodType == "colosseum" then null else 10000 end),
              clans: ([.clans[] | {
                nom: .name,
                points: .fame,
                aujourdhui: .periodPoints,
                combats: ([(.participants // [])[].decksUsedToday] | add // 0),
                fini: ((.finishTime // "1969") | startswith("1969") | not),
                nous: (.tag == "#LJ8GVLQC")
              }] | sort_by(-.points))
            }' cur.json > data/guerre.json || true
          fi

          # Rivaux : les 5 clans au-dessus et les 5 en dessous au classement national
          jq '(.items | map(.tag) | index("#LJ8GVLQC")) as $i
            | if $i == null then {clans: []}
              else {clans: [.items[([$i - 5, 0] | max):($i + 6)][] | {
                rang: .rank, nom: .name, trophees: .clanScore, membres: .members, nous: (.tag == "#LJ8GVLQC")
              }]} end' rank.json > data/rivaux.json || true

          # Rivaux en guerre : les 5 clans de la course actuelle, classés par trophées de guerre
          if [ -s cur.json ]; then
            jq '{clans: ([.clans[] | {nom: .name, trophees: .clanScore, nous: (.tag == "#LJ8GVLQC")}]
              | sort_by(-.trophees) | to_entries | map(.value + {rang: (.key + 1)}))}' cur.json > data/rivaux-guerre.json || true
          fi

          # Une fiche par joueur : data/joueurs/<TAG>.json
          [ -s cur.json ] || echo '{}' > cur.json
          jq -r '.memberList[] | [.tag, .role, .donations] | @tsv' clan.json |
          while IFS=$'\t' read -r TAG ROLE DONS; do
            T="${TAG#\#}"
            curl -sf -H "$AUTH" "$API/players/%23$T" > p.json || continue
            curl -sf -H "$AUTH" "$API/players/%23$T/battlelog" > b.json || echo '[]' > b.json
            jq --arg tag "$TAG" --arg role "$ROLE" --argjson dons "$DONS" --slurpfile log log.json --slurpfile b b.json --slurpfile cur cur.json '
              {
                tag: ($tag | ltrimstr("#")),
                nom: .name,
                role: ({leader: "Chef", coLeader: "Chef adjoint", elder: "Aîné", member: "Membre"}[$role] // $role),
                niveau: .expLevel,
                trophees: .trophies,
                record: .bestTrophies,
                victoires: .wins,
                dons: $dons,
                deck: [(.currentDeck // [])[] | {nom: .name, image: .iconUrls.medium}],
                # Ligue ranked de la saison (numero donne par Clash Royale : 1 = Maitre I ... 7 = Ultimate Champion)
                ligue: ((.currentPathOfLegendSeasonResult // {}).leagueNumber // null),
                # Guerre en cours : points et combats du joueur cette semaine
                enCours: (($cur[0].clan.participants // []) | map(select(.tag == $tag)) | .[0]
                  | if . == null then null else {
                      points: .fame, combats: .decksUsed, aujourdhui: .decksUsedToday,
                      type: $cur[0].periodType, jour: (($cur[0].periodIndex // -1) % 7), semaine: (($cur[0].sectionIndex // 0) + 1),
                      # Saison absente de la course en cours : on la déduit de la dernière guerre terminée
                      saison: ($log[0].items[0] as $l | if $l == null then null
                        elif ($cur[0].sectionIndex // 0) > ($l.sectionIndex // -1) then $l.seasonId else $l.seasonId + 1 end)
                    } end),
                mvps: ([$log[0].items[]
                  | (.standings[] | select(.clan.tag == "#LJ8GVLQC") | .clan.participants) as $p
                  | ($p | map(.fame) | max) as $m
                  | select($m > 0) | $p[] | select(.tag == $tag and .fame == $m)] | length),
                combats: [($b[0] // [])[:10][] | {
                  date: .battleTime,
                  type: .type,
                  mode: (.gameMode.name // ""),
                  moi: (.team[0].crowns // 0),
                  adv: (.opponent[0].crowns // 0),
                  trophees: (.team[0].trophyChange // null),
                  adversaire: (.opponent[0].name // "?"),
                  clanAdv: (.opponent[0].clan.name // null),
                  deckAdv: [(.opponent[0].cards // [])[] | {nom: .name, image: .iconUrls.medium}]
                }],
                guerres: [
                  $log[0].items[] | . as $w
                  | .standings[] | select(.clan.tag == "#LJ8GVLQC")
                  | .clan.participants[] | select(.tag == $tag)
                  | {semaine: "Saison \($w.seasonId) – semaine \($w.sectionIndex + 1)", points: .fame, combats: .decksUsed}
                ]
              }' p.json > "data/joueurs/$T.json"

            # Progression du joueur : un point si ses trophées ont changé, sinon au moins toutes les 6 h (500 points max)
            H="data/progression/$T.json"
            [ -f "$H" ] || echo '[]' > "$H"
            jq --slurpfile p "data/joueurs/$T.json" --arg now "$(date -u +%FT%TZ)" '
              ($p[0].trophees) as $t | (last // null) as $l
              | if $l == null or $l.t != $t or (($now | fromdateiso8601) - (($l.d // $now) | fromdateiso8601)) > 21600
                then . + [{d: $now, t: $t}] else . end
              | .[-500:]' "$H" > h.json && mv h.json "$H" || true
          done

          # Ligues de tous les membres en un seul fichier (pour le classement de la page d accueil)
          jq -s 'map({key: .tag, value: .ligue}) | from_entries' data/joueurs/*.json > data/ligues.json || true

          # On supprime seulement les fiches des joueurs qui ont quitté le clan.
          # (Si l API ne répond pas pour un joueur, son ancienne fiche reste en ligne au lieu de disparaître.)
          for f in data/joueurs/*.json; do
            t=$(basename "$f" .json)
            jq -e --arg t "#$t" 'any(.memberList[]; .tag == $t)' clan.json > /dev/null || rm -f "$f"
          done

          # Fil « Ça bouge dans le clan » : montées de ligue, 14 000 trophées, promotions, fin de guerre, record national
          node <<'FIN_EVENEMENTS' || true
          // Fil « Ça bouge dans le clan » : compare l'état actuel avec celui du passage précédent
          const fs = require('fs');
          const lire = (f, d) => { try { return JSON.parse(fs.readFileSync(f, 'utf8')); } catch (e) { return d; } };
          const NOUS = '#LJ8GVLQC';
          const maintenant = new Date().toISOString();

          const clanApi = lire('clan.json', { memberList: [] });
          const clan = lire('data/clan.json', {});
          const ligues = lire('data/ligues.json', {});
          const log = lire('log.json', { items: [] });
          const histo = lire('data/historique.json', []);
          const prec = lire('data/etat-precedent.json', null);
          const evts = lire('data/evenements.json', []);

          const ordreRole = { member: 0, elder: 1, coLeader: 2, leader: 3 };
          const nomRole = { elder: 'Aîné', coLeader: 'Chef adjoint', leader: 'Chef' };

          // État actuel
          const joueurs = {};
          for (const m of clanApi.memberList || []) {
            const tag = m.tag.replace('#', '');
            joueurs[tag] = { nom: m.name, role: m.role, trophees: m.trophies, ligue: ligues[tag] ?? null };
          }
          const derniere = (log.items || [])[0];
          const guerreId = derniere ? derniere.seasonId + '-' + derniere.sectionIndex : null;
          const rangs = histo.map(p => p.rang).filter(Boolean);
          const record = Math.min(243, ...rangs, clan.rang || Infinity); // 243e : record connu du clan

          if (!Object.keys(joueurs).length) process.exit(0); // API indisponible : on ne touche à rien

          if (prec) {
            const ajout = e => evts.push({ date: maintenant, ...e });

            for (const [tag, j] of Object.entries(joueurs)) {
              const p = prec.joueurs[tag];
              if (!p) continue; // nouveau membre : déjà dans « Arrivées et départs »
              if (j.ligue && p.ligue && j.ligue > p.ligue) ajout({ type: 'ligue', tag, nom: j.nom, ligue: j.ligue });
              if (j.trophees >= 14000 && p.trophees < 14000) ajout({ type: 'trophees', tag, nom: j.nom });
              if ((ordreRole[j.role] ?? 0) > (ordreRole[p.role] ?? 0) && nomRole[j.role]) ajout({ type: 'promo', tag, nom: j.nom, role: nomRole[j.role] });
            }

            // Fin de guerre : 1re, 2e ou 3e place
            if (derniere && guerreId !== prec.guerreId) {
              const nous = (derniere.standings || []).find(s => s.clan && s.clan.tag === NOUS);
              if (nous && nous.rank <= 3) {
                ajout({ type: 'guerre', place: nous.rank, saison: derniere.seasonId, semaine: derniere.sectionIndex + 1, trophees: nous.trophyChange || 0 });
              }
            }

            // Nouveau record au classement national
            if (clan.rang && prec.record && clan.rang < prec.record) ajout({ type: 'record', rang: clan.rang });
          }

          fs.writeFileSync('data/evenements.json', JSON.stringify(evts.slice(-40), null, 1));
          fs.writeFileSync('data/etat-precedent.json', JSON.stringify({ joueurs, guerreId, record }));
          FIN_EVENEMENTS

          # Joueur du mois : guerre + dons + trophées gagnés sur le mois (voir .github/scripts/joueur-du-mois.js)
                    node .github/workflows/.github/scripts/joueur-du-mois.js || true

          rm -f clan.json rank.json log.json p.json b.json cur.json
      - name: Enregistrer
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Mise à jour du classement" && git pull --rebase && git push)
